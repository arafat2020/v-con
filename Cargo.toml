[package]
name = "vcon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
bytes = "1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
fs4 = "0.13"
futures = "0.3.34"
glob = "0.3.4"
nucleo = "0.5.0"
openssh-sftp-client = "0.15"
portable-pty = "0.9"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shellexpand = "3.1.2"
strsim = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-term = "0.3.4"
tui-tree-widget = "0.24.1"
vt100 = "0.16.2"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.49.0"
predicates = "3.1"
proptest = "1.6"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
